name: CI

on:
  push:
    branches:
      - main
      - ci
  pull_request:
    branches:
      - "*"

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv sync --frozen --no-default-groups --group=check
      - run: uv run --frozen --no-default-groups --group=check poe lint
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: uv run --frozen --no-default-groups --group=check poe typecheck

  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Set up latest ggt with timing cache
        uses: vercel-labs/ggt@d5c4cde0d300ff9158797001a1ecb83e4c19a76c # v1.5.3
        with:
          enable-cache: true
          install: false
      - run: uv run --frozen --no-default-groups --group=check poe test

  summary:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs: [checks, tests]
    permissions: {}
    steps:
      - name: Check required jobs
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
        run: |
          echo "checks: ${CHECKS_RESULT}"
          echo "tests: ${TESTS_RESULT}"

          if [ "${CHECKS_RESULT}" != "success" ] \
              || [ "${TESTS_RESULT}" != "success" ]; then
            exit 1
          fi
