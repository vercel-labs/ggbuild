[project]
name = "ggbuild"
version = "0.1.0"
description = "Cross-platform meta packaging system"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSES/*"]
authors = [
    { name = "MagicStack Inc.", email = "hello@magic.io" },
]
requires-python = ">=3.14"
readme = "README.rst"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
    "Typing :: Typed",
]
dependencies = [
    "build~=1.2.1",
    "distlib~=0.4.3",
    "distro~=1.9.0",
    "docker>=7.1",
    "lograil>=0.7.0",
    "poetry~=2.1.3",
    "requests~=2.31.0",
    "setuptools>=75.3.1",
    "setuptools-rust>=0.11.4",
    "defusedxml>=0.7.1",
    "typing-extensions>=4.12",
    "wheel>=0.32.3",
    "zstandard>=0.25.0",
]

[dependency-groups]
test = [
    "ggt>=1.5.3",
    "pytest>=9,<10",
]

typing = [
    "types-docker",
    "types-defusedxml",
    "types-pyyaml",
    "types-requests",
    "types-toml",
]

# Type checkers and linters stay constrained by uv.lock in CI.
check = [
    "lograil",
    "mypy",
    "poethepoet",
    "readme-renderer",
    "ruff",
    "ty",
    "zizmor",
    { include-group = "test" },
    { include-group = "typing" },
]

dev = [
    { include-group = "test" },
    { include-group = "check" },
]

[project.urls]
homepage = "https://github.com/vercel-labs/ggbuild"
source = "https://github.com/vercel-labs/ggbuild"
issues = "https://github.com/vercel-labs/ggbuild/issues"

[project.scripts]
ggbuild = "ggbuild.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ggbuild"]

[tool.uv]
default-groups = ["dev"]
# First-party and selected tooling release cutoffs.
exclude-newer-package = { ggt = "2026-08-21T23:59:59Z", ruff = "2026-07-24T00:00:00Z", ty = "2026-08-20T00:00:00Z", types-pyyaml = "2026-07-25T00:00:00Z", types-toml = "2026-07-25T00:00:00Z", zizmor = "2026-07-24T00:00:00Z" }

# ========================
#           POE
# ========================

[tool.poe]
verbosity = -1

[tool.poe.tasks.setup]
sequence = ["sync-githooks"]

[tool.poe.tasks.sync-githooks]
cmd = "python scripts/sync-githooks.py"

[tool.poe.tasks.fix]
sequence = ["ruff-check-fix", "ruff-format-fix"]

[tool.poe.tasks.lint]
cmd = "python scripts/poe.py lint --poe-verbose ${verbose:-false}"
args = [{ name = "verbose", options = ["-v", "--verbose"], type = "boolean" }]

[tool.poe.tasks.typecheck]
cmd = "python scripts/poe.py typecheck --poe-verbose ${verbose:-false}"
args = [{ name = "verbose", options = ["-v", "--verbose"], type = "boolean" }]

[tool.poe.tasks.test]
cmd = "python scripts/poe.py test --poe-verbose ${verbose:-false}"
args = [{ name = "verbose", options = ["-v", "--verbose"], type = "boolean" }]

[tool.poe.tasks.qa]
cmd = "python scripts/poe.py qa --poe-verbose ${verbose:-false}"
args = [{ name = "verbose", options = ["-v", "--verbose"], type = "boolean" }]

[tool.poe.tasks.pre-commit]
cmd = "python scripts/poe.py pre-commit"

[tool.poe.tasks.pre-push]
cmd = "python scripts/poe.py pre-push"

[tool.poe.tasks.ruff-check]
cmd = "ruff check"

[tool.poe.tasks.ruff-check-fix]
cmd = "ruff check --fix"

[tool.poe.tasks.ruff-format]
cmd = "ruff format --check"

[tool.poe.tasks.ruff-format-fix]
cmd = "ruff format"

[tool.poe.tasks.lint-zizmor]
cmd = "zizmor --offline .github/workflows"

[tool.poe.tasks.lint-readme]
cmd = "python scripts/check-readme.py"

[tool.poe.tasks.typecheck-mypy]
cmd = "mypy"

[tool.poe.tasks.typecheck-ty]
cmd = "ty check"

# ========================
#          MYPY
# ========================

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = ["src"]
files = ["src", "tests", "scripts"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["distlib", "distlib.*"]
ignore_missing_imports = true

# ========================
#            TY
# ========================

[tool.ty]

[tool.ty.environment]
python-version = "3.14"
extra-paths = ["src"]

[tool.ty.src]
include = ["src", "tests", "scripts"]

# ========================
#           RUFF
# ========================

[tool.ruff]
line-length = 80
target-version = "py314"
preview = true

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
extend-select = [
    "A",     # flake8-builtins
    "ANN",   # flake8-annotations
    "BLE",   # flake8-blind-except
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez
    "ERA",   # flake8-eradicate
    "FA",    # flake8-future-annotations
    "FBT",   # flake8-boolean-trap
    "FLY",   # flynt
    "FIX",   # flake8-fixme
    "FURB",  # refurb
    "G",     # flake8-logging-format
    "ICN",   # flake8-import-conventions
    "INP",   # flake8-no-pep420 (on PyPI)
    "LOG",   # flake8-logging
    "N",     # pep8-naming
    "PERF",  # perflint
    "PGH",   # pygrep-hooks
    "PIE",   # flake8-pie
    "PLC",   # pylint-convention
    "PLE",   # pylint-error
    "PLR",   # pylint-refactor
    "PLW",   # pylint-warning
    "PTH",   # flake8-use-pathlib
    "PYI",   # flake8-pyi
    "Q",     # flake8-quotes
    "RET",   # flake8-return
    "RSE",   # flake8-raise
    "RUF",   # ruff specific
    "S",     # flake8-bandit
    "SIM",   # flake8-simplify
    "SLF",   # flake8-self
    "SLOT",  # flake8-slots
    "T10",   # flake8-debugger
    "T20",   # flake8-print
    "TC",    # flake8-type-checking
    "TRY",   # tryceratops
    "YTT",   # flake8-2020

    "explicit-string-concatenation",
    "implicit-string-concatenation-in-collection-literal",
    "import-outside-top-level",
    "import-private-name",
    "manual-list-comprehension",
    "single-line-implicit-string-concatenation",
    "sorted-min-max",
    "trailing-comma-on-bare-tuple",
    "type-name-incorrect-variance",
]
extend-ignore = [
    "any-type",
    "f-string-missing-placeholders",
    "incorrect-blank-line-before-class",
    "multi-line-summary-second-line",
    "no-self-use",
    "raise-vanilla-args",
    "suspicious-subprocess-import",
    "suppressible-exception",
    "try-except-in-loop",
    "typing-only-first-party-import",
    "typing-only-standard-library-import",
    "typing-only-third-party-import",
    "unused-async",
]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = false

[tool.ruff.lint.isort]
combine-as-imports = true

known-first-party = ["ggbuild"]
section-order = [
    "future",
    "typing",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.isort.sections]
typing = ["typing", "typing_extensions"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["assert", "magic-value-comparison"]
"tests/helper_fixture/__init__.py" = ["non-empty-init-module"]
"tests/patch_fixture/__init__.py" = ["non-empty-init-module"]
"tests/helper_fixture/helpers/*.py" = [
    "print", # fixture models a standalone executable recipe helper
]
"scripts/**/*.py" = [
    "print", # development scripts intentionally report progress to the console
]
"src/ggbuild/targets/_helpers/*.py" = [
    "invalid-module-name", # installed helper filenames are part of the shell API
    "print", # standalone helper scripts intentionally emit results and progress
]
"tests/test_keepwork_integration.py" = [
    "subprocess-without-shell-equals-true", # argv is entirely test-controlled
    "too-many-locals", # one scenario intentionally follows the full lifecycle
]
"scripts/sync-githooks.py" = [
    "subprocess-without-shell-equals-true", # Git arguments are fully controlled by this script
    "start-process-with-partial-path", # Git is intentionally resolved from PATH
]

[tool.ruff.lint.pylint]
allow-magic-value-types = ["int", "str"]
max-args = 10
max-returns = 10
max-statements-in-try = 10
